[project]
name = "web-crawler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "asyncpg>=0.31.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.2",
    "selectolax>=0.4.11",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
